# ===========================================================
# APPLICATION
# ===========================================================
spring.application.name=BillWise
server.port=8080


# ===========================================================
# DATABASE
# ===========================================================
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/billwise;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}


# ===========================================================
# JPA / HIBERNATE
# ===========================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
spring.jpa.database-platform=${DB_DIALECT:org.hibernate.dialect.H2Dialect}
spring.jackson.serialization.write-dates-as-timestamps=false


# ===========================================================
# CORS
# ===========================================================
spring.web.cors.allowed-origins=http://localhost:3000
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.web.cors.allowed-headers=*
spring.web.cors.allow-credentials=true


# ===========================================================
# JWT
# ===========================================================
jwt.secret=${JWT_SECRET:MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWYwMTIzNDU2Nzg5YWJjZGVmMDEyMzQ1Njc4OWFiY2RlZg==}
jwt.expiration=86400000


# ===========================================================
# ML SERVICE
# ===========================================================
ml.service.base-url=${ML_API_BASE_URL:http://localhost:5000}


# ===========================================================
# LOGGING
# ===========================================================
logging.level.org.springframework.security=DEBUG
logging.level.com.aksps.billwise=DEBUG

